name: OmniRouter Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to package (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: omnirouter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Build Vue admin assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build admin assets
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s ../internal/admin/static/dist/index.html
          test -n "$(find ../internal/admin/static/dist/assets -type f -print -quit)"

      - name: Upload embedded admin assets
        uses: actions/upload-artifact@v4
        with:
          name: omnirouter-admin-static
          path: internal/admin/static/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: frontend
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download embedded admin assets
        uses: actions/download-artifact@v4
        with:
          name: omnirouter-admin-static
          path: internal/admin/static/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go test ./...
          go vet ./...

      - name: Cross-compile
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="omnirouter-${VERSION}-${GOOS}-${GOARCH}"
          COMMIT="$(git rev-parse HEAD)"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X omnirouter/internal/version.Version=${VERSION} -X omnirouter/internal/version.Commit=${COMMIT}" -o "dist/${name}${EXT}" ./cmd/omnirouter
          cp README.md "dist/README.md"
          cp -R browser-extension "dist/browser-extension"
          cp docs/INSTALL.md "dist/INSTALL.md"
          cp examples/omnirouter.env.example "dist/omnirouter.env.example"
          cp docs/DATABASE-BACKUP-RESTORE.md "dist/DATABASE-BACKUP-RESTORE.md"
          cp docs/PROVIDER-ACCEPTANCE.md "dist/PROVIDER-ACCEPTANCE.md"
          cp docs/DEEPSEEK-ADAPTER.md "dist/DEEPSEEK-ADAPTER.md"
          cp docs/ANDROID-TERMUX-ACCEPTANCE.md "dist/ANDROID-TERMUX-ACCEPTANCE.md"
          cp docs/V1-RELEASE-CHECKLIST.md "dist/V1-RELEASE-CHECKLIST.md"
          mkdir -p dist/scripts
          cp scripts/backup-sqlite.sh scripts/restore-sqlite.sh scripts/provider-smoke.sh scripts/deepseek-smoke.sh scripts/termux-smoke.sh dist/scripts/
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -r "${name}.zip" "${name}${EXT}" README.md INSTALL.md omnirouter.env.example DATABASE-BACKUP-RESTORE.md PROVIDER-ACCEPTANCE.md DEEPSEEK-ADAPTER.md ANDROID-TERMUX-ACCEPTANCE.md V1-RELEASE-CHECKLIST.md scripts browser-extension)
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}${EXT}" README.md INSTALL.md omnirouter.env.example DATABASE-BACKUP-RESTORE.md PROVIDER-ACCEPTANCE.md DEEPSEEK-ADAPTER.md ANDROID-TERMUX-ACCEPTANCE.md V1-RELEASE-CHECKLIST.md scripts/backup-sqlite.sh scripts/restore-sqlite.sh scripts/provider-smoke.sh scripts/deepseek-smoke.sh scripts/termux-smoke.sh browser-extension/README.md browser-extension/manifest.json browser-extension/popup.html browser-extension/popup.js browser-extension/popup.css
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: omnirouter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: OmniRouter ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
