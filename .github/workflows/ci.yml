name: OmniRouter CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnirouter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Check smoke-test script syntax
        run: |
          bash -n scripts/provider-smoke.sh
          bash -n scripts/termux-smoke.sh

      - name: Check workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |path| YAML.load_file(path); puts "YAML OK: #{path}" }'

      - name: Check release package inputs
        run: |
          test -s docs/INSTALL.md
          test -s examples/omnirouter.env.example
          test -s docs/ANDROID-TERMUX-ACCEPTANCE.md
          test -s .github/workflows/live-provider-smoke.yml
          test -s .github/workflows/release.yml

      - name: Unit and integration tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/omnirouter ./cmd/omnirouter

  cross-build:
    name: Cross-build and package ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build and package release candidate
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          name="omnirouter-ci-${GOOS}-${GOARCH}"
          go build -trimpath -o "dist/${name}${EXT}" ./cmd/omnirouter
          cp README.md "dist/README.md"
          cp docs/INSTALL.md "dist/INSTALL.md"
          cp examples/omnirouter.env.example "dist/omnirouter.env.example"
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -j "${name}.zip" "${name}${EXT}" README.md INSTALL.md omnirouter.env.example)
            archive="dist/${name}.zip"
          else
            archive="dist/${name}.tar.gz"
            tar -C dist -czf "${archive}" "${name}${EXT}" README.md INSTALL.md omnirouter.env.example
          fi
          test -s "${archive}"
