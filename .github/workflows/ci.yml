name: OmniRouter CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnirouter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build Vue admin assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies and build
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s ../internal/admin/static/dist/index.html
          test -n "$(find ../internal/admin/static/dist/assets -type f -print -quit)"

      - name: Upload embedded admin assets
        uses: actions/upload-artifact@v4
        with:
          name: omnirouter-admin-static
          path: internal/admin/static/dist/
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download embedded admin assets
        uses: actions/download-artifact@v4
        with:
          name: omnirouter-admin-static
          path: internal/admin/static/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Check smoke-test script syntax
        run: |
          bash -n scripts/provider-smoke.sh
          bash -n scripts/termux-smoke.sh
          bash -n scripts/backup-sqlite.sh
          bash -n scripts/restore-sqlite.sh

      - name: Test SQLite backup and restore scripts
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
          tmp="$(mktemp -d "${RUNNER_TEMP}/omni backup.XXXXXX")"
          trap 'rm -rf "${tmp}"' EXIT
          sqlite3 "${tmp}/source.db" 'CREATE TABLE sample(value TEXT NOT NULL); INSERT INTO sample VALUES("backup-value");'
          bash scripts/backup-sqlite.sh "${tmp}/source.db" "${tmp}/backup.db"
          sqlite3 "${tmp}/restored.db" 'CREATE TABLE sample(value TEXT NOT NULL); INSERT INTO sample VALUES("old-value");'
          bash scripts/restore-sqlite.sh "${tmp}/restored.db" "${tmp}/backup.db"
          test "$(sqlite3 "${tmp}/restored.db" 'SELECT value FROM sample;')" = "backup-value"
          test -n "$(find "${tmp}" -name 'restored.db.pre-restore.*' -print -quit)"

      - name: Check workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |path| YAML.load_file(path); puts "YAML OK: #{path}" }'

      - name: Check release package inputs
        run: |
          test -s docs/INSTALL.md
          test -s examples/omnirouter.env.example
          test -s docs/ANDROID-TERMUX-ACCEPTANCE.md
          test -s docs/DATABASE-BACKUP-RESTORE.md
          test -s .github/workflows/live-provider-smoke.yml
          test -s .github/workflows/release.yml

      - name: Unit and integration tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build and verify version command
        run: |
          go build -o /tmp/omnirouter ./cmd/omnirouter
          /tmp/omnirouter --version | grep -F "OmniRouter dev"

  cross-build:
    needs: frontend
    name: Cross-build and package ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download embedded admin assets
        uses: actions/download-artifact@v4
        with:
          name: omnirouter-admin-static
          path: internal/admin/static/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build and package release candidate
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          name="omnirouter-ci-${GOOS}-${GOARCH}"
          go build -trimpath -o "dist/${name}${EXT}" ./cmd/omnirouter
          cp README.md "dist/README.md"
          cp docs/INSTALL.md "dist/INSTALL.md"
          cp examples/omnirouter.env.example "dist/omnirouter.env.example"
          cp docs/DATABASE-BACKUP-RESTORE.md "dist/DATABASE-BACKUP-RESTORE.md"
          cp docs/PROVIDER-ACCEPTANCE.md "dist/PROVIDER-ACCEPTANCE.md"
          cp docs/ANDROID-TERMUX-ACCEPTANCE.md "dist/ANDROID-TERMUX-ACCEPTANCE.md"
          cp docs/V1-RELEASE-CHECKLIST.md "dist/V1-RELEASE-CHECKLIST.md"
          mkdir -p dist/scripts
          cp scripts/backup-sqlite.sh scripts/restore-sqlite.sh scripts/provider-smoke.sh scripts/termux-smoke.sh dist/scripts/
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -r "${name}.zip" "${name}${EXT}" README.md INSTALL.md omnirouter.env.example DATABASE-BACKUP-RESTORE.md PROVIDER-ACCEPTANCE.md ANDROID-TERMUX-ACCEPTANCE.md V1-RELEASE-CHECKLIST.md scripts)
            archive="dist/${name}.zip"
          else
            archive="dist/${name}.tar.gz"
            tar -C dist -czf "${archive}" "${name}${EXT}" README.md INSTALL.md omnirouter.env.example DATABASE-BACKUP-RESTORE.md PROVIDER-ACCEPTANCE.md ANDROID-TERMUX-ACCEPTANCE.md V1-RELEASE-CHECKLIST.md scripts/backup-sqlite.sh scripts/restore-sqlite.sh scripts/provider-smoke.sh scripts/termux-smoke.sh
          fi
          test -s "${archive}"
