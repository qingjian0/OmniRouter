name: Temporary Go formatting

on:
  push:
    branches:
      - feature/deepseek-official-api

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format Go sources and commit changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.go' -type f)
          gofmt -w "${files[@]}"
          if git diff --quiet; then
            echo "All Go files are already gofmt-clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "style: gofmt native DeepSeek protocol adapters"
          git push origin "HEAD:${GITHUB_REF_NAME}"
